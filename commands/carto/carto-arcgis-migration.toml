description = "End-to-end ArcGIS Portal / AGOL → CARTO migration. Triggers when the user wants to migrate ArcGIS content to CARTO, plan a migration, asks "what's in my Portal", names a Portal/AGOL URL, or asks to migrate the datasets / web maps / simple apps. Runs three phases — discover (enumerate items + write MIGRATION_MANIFEST.md), migrate-data (Hosted Feature Layers / Tables → CARTO tables), migrate-maps (Web Maps + simple Dashboards / Web Experiences / Web Mapping Apps → CARTO Builder maps). Default mode is batch; migrated maps are always tagged `From ArcGIS` and created as private (carto-skills)"

prompt = """
Apply the `carto-arcgis-migration` skill from the carto-skills catalog to the user's request.

Required behavior:
- Read the skill's main guidance at `skills/carto-arcgis-migration/SKILL.md` first.
- Follow the skill's reference files (under `skills/carto-arcgis-migration/references/`) for depth on specific topics.
- Stay within the skill's stated scope; if the request belongs to a different skill, say which one and stop.
- For machine-parseable CLI output, always pass `--json`.
"""
