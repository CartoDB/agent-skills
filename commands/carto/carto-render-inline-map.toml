description = "Render an ad-hoc interactive map inline in the chat from a deck.gl declarative spec via the CARTO MCP server's view_map tool. Use whenever the user asks to map, visualize, or show the geographic distribution of points, polygons, hexagons, quadbins, clusters, density (heatmaps), or raster — and the map is exploratory or throwaway, not meant to be saved as a permanent CARTO Builder map. Triggers on "show me X on a map", "visualize Y", "make a heatmap of Z", "render the points/clusters/raster of W". Distinct from carto-create-builder-maps (authoring permanent maps), carto-preview-builder-map (loading an existing saved Builder map), and carto-develop-app (writing a from-scratch deck.gl app in TypeScript / JavaScript) (carto-skills)"

prompt = """
Apply the `carto-render-inline-map` skill from the carto-skills catalog to the user's request.

Required behavior:
- Read the skill's main guidance at `skills/carto-render-inline-map/SKILL.md` first.
- Follow the skill's reference files (under `skills/carto-render-inline-map/references/`) for depth on specific topics.
- Stay within the skill's stated scope; if the request belongs to a different skill, say which one and stop.
- For machine-parseable CLI output, always pass `--json`.
"""
